<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MsStatTractor Web — 楓之谷練功追蹤（瀏覽器版）</title>
<style>:root{--lightningcss-light: ;--lightningcss-dark:initial;color-scheme:dark}*{box-sizing:border-box}body{color:#e8eaf0;background:#12141a;margin:0;padding:18px;font-family:Segoe UI,system-ui,Microsoft JhengHei,sans-serif}h1{margin:0 0 4px;font-size:17px;font-weight:600}.sub{color:#8b93a7;margin-bottom:14px;font-size:12px;line-height:1.6}.row{flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px;display:flex}button{color:#fff;cursor:pointer;background:#2f6df6;border:0;border-radius:8px;padding:10px 16px;font-size:14px;font-weight:600}button.ghost{color:#cfd5e4;background:#262a35;font-weight:500}button:hover{filter:brightness(1.1)}#status{color:#9aa3b8;min-height:18px;font-size:12.5px}#status.bad{color:#ff8b8b}.grid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0;display:grid}.card{background:#1b1f29;border:1px solid #262b38;border-radius:10px;padding:12px 14px}.card .k{color:#8b93a7;margin-bottom:6px;font-size:11.5px}.card .v{font-variant-numeric:tabular-nums;font-size:22px;font-weight:600}.card .s{color:#7f879b;margin-top:4px;font-size:11.5px}video{background:#000;border:1px solid #262b38;border-radius:8px;width:320px}#raw{color:#6f7789;word-break:break-all;margin-top:10px;font-family:ui-monospace,monospace;font-size:11.5px}.foot{color:#6f7789;border-top:1px solid #262b38;margin-top:16px;padding-top:10px;font-size:11.5px;line-height:1.7}</style>
  <script type="module" crossorigin src="./assets/index-DYdNFXN7.js"></script>
</head>
<body>
  <h1>MsStatTractor Web <span style="color:#8b93a7;font-weight:400;font-size:13px">PoC</span></h1>
  <div class="sub">
    按下面的按鈕，在彈出的清單中選<b>楓之谷（或 Magpie 放大後的那個視窗）</b>。<br>
    畫面只在你這台電腦的瀏覽器裡辨識，不會上傳。頁面要保持在開著（可以縮到旁邊或最小化）。
  </div>

  <div class="row">
    <button id="pick">選擇遊戲視窗</button>
    <button id="reset" class="ghost">重新計時</button>
    <video id="video" muted playsinline></video>
  </div>
  <div id="status"></div>

  <div class="grid">
    <div class="card"><div class="k">等級</div><div class="v" id="lv">—</div><div class="s" id="ticks">0</div></div>
    <div class="card"><div class="k">經驗值</div><div class="v" id="expCur">—</div><div class="s" id="expPct">—</div></div>
    <div class="card"><div class="k">HP</div><div class="v" id="hp">—</div></div>
    <div class="card"><div class="k">MP</div><div class="v" id="mp">—</div></div>
    <div class="card"><div class="k">本次經驗收益</div><div class="v" id="gain">0</div><div class="s" id="elapsed">—</div></div>
    <div class="card"><div class="k">EXP / 小時</div><div class="v" id="rate">—</div></div>
    <div class="card"><div class="k">預計升級</div><div class="v" id="eta">—</div><div class="s">依目前速度估算</div></div>
  </div>
  <div id="raw"></div>

  <div class="foot">
    這是不會安裝任何 exe 的網頁版：沒有背景程式、不注入遊戲、不讀取記憶體，只用瀏覽器內建的視窗擷取＋本機 OCR。<br>
    建議用電腦版 Chrome / Edge；首次開啟要下載約 30MB 的辨識模型（之後會用瀏覽器快取，第二次不用再下載）。
  </div>

</body>
</html>
